snakey-continents-old=Dünne, schlangenartige Kontinente bilden natürliche Engpässe und Wege, die es zu erkunden gilt. (Unter Verwendung der alten Factorio-1.1-Kartengenerierung für Seen)
oasis=Starte mit nur einem einzigen Gewässer. Suche nach Brunnen oder transportiere deinen Startvorrat bei Bedarf an einen anderen Ort. Die Ressourcen sind knapp.



