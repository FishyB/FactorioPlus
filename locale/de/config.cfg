[mod-setting-description]
settings-enemy-power-scaling=Wie schnell oder langsam sich Feinde/Verlassene Außenposten/Beute über die Distanz skalieren (in %). \n(Niedriger = schneller/schwieriger, höher = langsamer/einfacher)

settings-turrets-vet-kill-damage-check-type=Ob der Veteranenrang des Turms anhand der Anzahl der Abschüsse, des verursachten Schadens oder beidem überprüft wird, um eine Stufe aufzusteigen. \nHinweis: Unabhängig davon, was ausgewählt wird, wird die Überprüfung nur durchgeführt, wenn der Turm einen Abschuss erzielt, um eine Stufe aufzusteigen.
settings-turrets-vet-bonus-increase=Wie viel zusätzliche Trefferpunkte, Angriffsgeschwindigkeit und Reichweite der Turm beim Aufsteigen erhält.
settings-turrets-vet-damage-milestones=Wie viel Schaden erforderlich ist, um jeweils eine Stufe aufzusteigen.
settings-turrets-vet-kill-milestones=Wie viele Abschüsse erforderlich sind, um jeweils eine Stufe aufzusteigen.
settings-loaders-electricity=Greifarme benötigen Strom, um zu funktionieren.
settings-crashsite-bonus-buildingstats=Wie viel zusätzliche Leistung/Herstellgeschwindigkeit haben die Gebäude am Absturzort zu Beginn des Spiels?
settings-crashsite-bonus-equipment=Wie viel zusätzliche Munition, Medkits, Waffen, Rüstungen usw. werden zu Beginn des Spiels an der Absturzstelle bereitgestellt?
settings-crashsite-bonus-scrap=Wie viel zusätzliches Schrottmaterial befindet sich zu Beginn des Spiels im Schiff an der Absturzstelle?
settings-crashsite-x-players=Multipliziert die Anzahl der Ausrüstungsgegenstände/Roboter mit dieser Spieleranzahl, sodass jeder Spieler seine eigene Ausrüstung erhält.
settings-crashsite-robots=Beginne mit einem einfachen modularen Harnisch und Baurobotern.
settings-combat-friendlyfire-percent=Der Prozentsatz des erlittenen Schadens durch indirektes Feuer. (Zum Beispiel durch Raketen, Mörser und andere sofortige Explosionsschäden, denen man nicht leicht ausweichen kann.)
settings-warehouse-abandonments=Aktivieren oder deaktivieren, ob verlassene Außenposten mit Geschütztürmen, Energieversorgung, Lagerhäusern und Beute erstellt werden sollen.
settings-status-panels=Erstellt kleine, einfache Statusleuchten in der Welt, die den Status von Montagemaschinen, Öfen und Erzförderern anzeigen, die noch nicht über solche Leuchten verfügen.
settings-recipe-cost=Welche Zutaten (und wie viele verschiedene Arten) zur Herstellung von Wissenschaftspaketen verwendet werden.
settings-character-selection=Wähle einen anderen Charakter aus, die alle unterschiedliche Basiswerte haben. (Bewege den Mauszeiger über den Charakter, um seine Werte anzuzeigen.)
settings-crashsite=Erstellt zu Beginn des Spiels einen Generator, Montagemaschinen und ein Labor rund um das abgestürzte Schiff.
settings-rocket-recipe=Multipliziert die Anzahl der Mikroprozessoren, Leichtbauteile und Raketentreibstoff, die zur Herstellung eines einzelnen Raketenbauteils verwendet werden.
settings-rocket-recipe-energy=Multipliziert den Energieaufwand (Zeit), der für die Herstellung eines einzelnen Raketenbauteils erforderlich ist.
settings-chunks-probability=Wahrscheinlichkeit, dass Spawner und mittelgroße bis große Gegner Alien-Brocken fallen lassen (in %).
settings-chunks-multiplier=Multipliziert die maximale erzeugte Mmenge von Alien-Brocken aus Spawnern und mittleren und größeren Gegnern.
settings-warehouse-spacing=Wie oft Lagerhäuser in einem verlassenen Außenposten auftauchen.
settings-warehouse-scaling=Wie wertvoll die Beute in den Lagerhäusern der Außenposten je nach Entfernung ist. (Höherer Prozentsatz skaliert langsamer)
settings-warehouse-barren=Lagerhäuser sind nach Erreichen der maximalen Entfernung leer, um eine unendliche Wiederholung der Lagerhausplünderung zu verhindern.
settings-loaders-active=Legt fest, ob Belader im aktuellen Spiel verfügbar sein sollen oder nicht.
settings-loaders-cost=Materialkosten für Belader aus Gründen der Ausgewogenheit ändern.
settings-enemy-health=Gesundheit der feindlichen Basis (umfasst: Einheiten, Gebäude, Spawner, Geschütztürme usw.)
settings-enemy-spawntime=Wie oft Spawner im Vergleich zu ihrer Basiszeit Gegner erzeugen.
settings-world-daynightcycle=Legt die Länge des gesamten Tages fest (Gesamtzeit von Tag und Nacht in Minuten)
settings-spoilage-multiplier=Wie lange es dauert, bis bestimmte Dinge verderben.



