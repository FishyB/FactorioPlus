settings-loaders-electricity=Погрузчики требуют электричество для работы.
settings-crashsite-bonus-buildingstats=Насколько выше мощность/скорость создания у построек на месте крушения в начале игры.
settings-crashsite-bonus-equipment=Сколько дополнительной аммуниции, здоровья, оружия, брони и т. п. даётся на месте крушения в начале игры.
settings-crashsite-bonus-scrap=Сколько дополнительного лома находится в обломках корабля на месте крушения в начале игры.
settings-crashsite-x-players=Умножает количество снаряжения/роботов на число игроков, чтобы каждому досталось своё.
settings-crashsite-robots=Старт с простым модульным жилетом и строительными роботами.
settings-combat-friendlyfire-percent=Процент входящего урона от непрямого огня (например, ракеты, мортиры и другие мгновенные взрывные повреждения, которые сложно увернуться).
settings-warehouse-abandonments=Включает/выключает создание заброшенных аванпостов с турелями, энергией, складами и лутом.
settings-status-panels=Создаёт маленькие простые световые панели статуса в мире, показывающие состояние станков, печей и буров, у которых нет встроенных индикаторов.
settings-recipe-cost=Какие ингредиенты (и сколько разных типов) используются для научных пакетов.
settings-character-selection=Выберите другого персонажа — у каждого разные базовые характеристики. (Наведите на персонажа, чтобы увидеть статы.)
settings-crashsite=Создаёт генератор, сборочные машины и лабораторию рядом с разбившимся кораблём в начале игры.
settings-rocket-recipe=Множитель количества процессоров, конструкций малой плотности и ракетного топлива, используемых для одной ракетной секции.
settings-rocket-recipe-energy=Множитель времени (энергии), требуемого для создания одной ракетной секции.
settings-chunks-probability=Шанс выпадения инопланетных кусков со спавнеров и врагов среднего размера и крупнее (в %).
settings-chunks-multiplier=Множитель максимального количества инопланетных кусков со спавнеров и врагов среднего размера и крупнее.
settings-warehouse-spacing=Как часто склады появляются в заброшенном аванпосте.
settings-warehouse-scaling=Насколько ценнее становится лут в складах аванпостов с расстоянием. (Больше % = масштабируется медленнее)
settings-warehouse-barren=После достижения максимальной дистанции склады станут пустыми, чтобы остановить бесконечный повтор лута.
settings-loaders-active=Включает/выключает доступность погрузчиков в текущей игре.
settings-loaders-cost=Изменяет материальную стоимость погрузчиков для баланса.
settings-enemy-health=Базовое здоровье врагов (включает: юниты, здания, спавнеры, турели и т. п.)
settings-enemy-spawntime=Как часто спавнеры создают врагов относительно базового времени.
settings-world-daynightcycle=Задаёт длительность всего дня (день + ночь, общее время в минутах)
settings-spoilage-multiplier=Как долго некоторым предметам требуется, чтобы испортиться.



