settings-turrets-vet-kill-damage-check-type=Что учитывает ветеранство турелей для повышения уровня: убийства, урон или оба параметра. \nПримечание: независимо от выбора, проверка выполняется только когда турель совершает убийство.
settings-turrets-vet-bonus-increase=Сколько дополнительного здоровья, скорости атаки и дальности получает турель при повышении уровня.
settings-turrets-vet-damage-milestones=Сколько урона требуется для повышения уровня на каждом тире.
